# Upstream for backend (NestJS on port 3000)
upstream backend_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name erm-api.hasafsec.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name erm-api.hasafsec.com;

    # SSL certificates (Let's Encrypt paths)
    ssl_certificate /etc/letsencrypt/live/erm-api.hasafsec.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erm-api.hasafsec.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # HSTS (optional)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy both /api and /app (with or without trailing slash)
    location ~ ^/(api|app)(/.*)?$ {
        # If the URI ends with just /api or /app, add a trailing slash
        set $proxy_uri $2;
        if ($proxy_uri = "") {
            set $proxy_uri /;
        }
        proxy_pass http://backend_api$proxy_uri$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 302 https://erm.hasafsec.com$request_uri;
    }
}