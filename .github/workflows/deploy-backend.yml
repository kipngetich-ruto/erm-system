name: Build and Deploy Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - 'nginx/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ✅ Login to GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ secrets.GHCR_USERNAME }}/emr-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 📁 Copy Nginx config file to EC2
      - name: Copy Nginx config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "nginx/emr.conf"
          target: "/etc/nginx/sites-available/"
          strip_components: 1   # removes the 'nginx/' prefix

      # 🚀 Deploy, setup SSL, and start containers
      - name: Deploy, setup Nginx & SSL, and start containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # ✅ Login to GHCR on EC2
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            # Install Certbot if missing
            if ! command -v certbot &> /dev/null; then
              sudo apt update
              sudo apt install -y certbot python3-certbot-nginx
            fi

            # Stop Nginx for standalone Certbot
            sudo systemctl stop nginx || true

            # Obtain SSL certificate
            sudo certbot certonly --standalone -d ${{ secrets.DOMAIN }} -d www.${{ secrets.DOMAIN }} \
              --noninteractive --agree-tos --email ${{ secrets.EMAIL }} --keep-until-expiring

            # Enable the site (symlink)
            sudo ln -sf /etc/nginx/sites-available/emr /etc/nginx/sites-enabled/

            # Test and reload Nginx
            sudo nginx -t
            sudo systemctl start nginx

            # Create frontend directory if needed (optional)
            sudo mkdir -p /var/www/emr-frontend
            sudo chown -R ubuntu:ubuntu /var/www/emr-frontend

            # Pull and restart containers
            cd /home/ubuntu/app
            docker compose pull
            docker compose up -d