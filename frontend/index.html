<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title – put your brand name here -->
    <title>EMR System – Secure Electronic Medical Records</title>

    <!-- Meta Description – helps SEO and social sharing -->
    <meta
      name="description"
      content="Secure EMR System for managing patient records with AES-256 encryption, 2FA, and role-based access control."
    />

    <!-- Theme Color for mobile browsers -->
    <meta name="theme-color" content="#0ea5e9" />

    <!-- Open Graph (Social Sharing) – for when someone shares your link -->
    <meta property="og:title" content="EMR System – Secure Electronic Medical Records" />
    <meta
      property="og:description"
      content="AES-256 encrypted Electronic Medical Records system with 2FA and RBAC."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://erm.hasafsec.com" />
    <meta property="og:image" content="https://erm.hasafsec.com/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EMR System – Secure Electronic Medical Records" />
    <meta
      name="twitter:description"
      content="AES-256 encrypted EMR system with 2FA and RBAC."
    />
    <meta name="twitter:image" content="https://erm.hasafsec.com/og-image.png" />

    <!-- Security Headers are now handled by vercel.json, no need to duplicate here -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
